name: CI

on:
  pull_request:
  push:

jobs:
  ci:
    name: CI check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate repository fixtures
        run: |
          test -s Readme.md
          test -s AUTOMATIC_PAYOUT_TEST.md
          git diff --check
